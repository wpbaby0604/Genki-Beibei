<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; background: transparent; }
  body { font-family: -apple-system, "Noto Sans TC", "Microsoft JhengHei", sans-serif; }
  .wrap { display: flex; flex-direction: column; gap: 6px; padding: 4px 2px; }
  .mic-btn {
    display: inline-flex; align-items: center; gap: 8px;
    border: 1px solid #cfcfcf; border-radius: 999px;
    padding: 8px 16px; font-size: 15px; cursor: pointer;
    background: #f6f6f6; color: #333; width: fit-content;
    transition: background .15s, border-color .15s, box-shadow .15s;
    user-select: none;
  }
  .mic-btn:hover { background: #eee; }
  .mic-btn.on {
    background: #e53935; border-color: #e53935; color: #fff;
    animation: pulse 1.4s infinite;
  }
  .mic-btn.speaking {
    background: #ff9800; border-color: #ff9800; color: #fff; animation: none;
  }
  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 rgba(229,57,53,.45); }
    70%  { box-shadow: 0 0 0 10px rgba(229,57,53,0); }
    100% { box-shadow: 0 0 0 0 rgba(229,57,53,0); }
  }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #bbb; }
  .mic-btn.on .dot, .mic-btn.speaking .dot { background: #fff; }
  .status { font-size: 13px; color: #666; min-height: 16px; line-height: 1.4; }
  .status.unsupported { color: #b26a00; }
</style>
</head>
<body>
  <div class="wrap">
    <button id="micBtn" class="mic-btn" type="button">
      <span class="dot"></span><span id="micLabel">🎙 語音常開：關</span>
    </button>
    <div id="status" class="status"></div>
  </div>

  <script src="./streamlit-component-lib.js"></script>
  <script>
  (function () {
    // ---- 可調參數（也可從 Python 傳 args 覆蓋）----
    var lang = "zh-TW";      // 辨識語言
    var minChars = 1;        // 少於這麼多字的整句視為雜訊、丟掉（1＝只丟空白）
    var BUFFER_MS = 400;     // 貝貝講完後多等一下再開麥（避免尾音被收到）
    var SAFETY_MS = 12000;   // 送出後若一直沒收到「AI 說完」訊號，最多等這麼久就自動恢復

    // ---- 內部狀態 ----
    var seq = 0;             // 每辨識出一句 +1，給 Python 去重
    var wantOn = false;      // 使用者想不想開著（toggle）
    var muted = false;       // 是否因為「AI 說話/處理中」而暫停聆聽
    var recog = null;
    var resumeTimer = null;
    var lastSpeakToken = null;   // 記住上一次 AI 語音的識別碼，用來偵測「新的一段朗讀」
    var SR = window.SpeechRecognition || window.webkitSpeechRecognition;

    var micBtn = document.getElementById("micBtn");
    var micLabel = document.getElementById("micLabel");
    var statusEl = document.getElementById("status");

    function setHeight() { Streamlit.setFrameHeight(document.body.scrollHeight + 4); }

    // ---- 功能偵測：不支援就自動降級，不擋任何人 ----
    if (!SR) {
      micBtn.style.display = "none";
      statusEl.textContent = "此瀏覽器不支援語音輸入，請直接打字（建議用 Chrome / Edge）。";
      statusEl.className = "status unsupported";
      Streamlit.onRender(function () { setHeight(); });
      Streamlit.setComponentValue({ supported: false, seq: 0, text: "" });
      setHeight();
      return;
    }

    function paintIdle() {
      micBtn.classList.remove("speaking");
      if (wantOn) { micBtn.classList.add("on"); micLabel.textContent = "🎙 語音常開：開"; statusEl.textContent = "聆聽中…"; }
      else        { micBtn.classList.remove("on"); micLabel.textContent = "🎙 語音常開：關"; statusEl.textContent = ""; }
      setHeight();
    }
    function paintSpeaking() {
      micBtn.classList.remove("on");
      micBtn.classList.add("speaking");
      micLabel.textContent = "🔇 貝貝說話中…";
      statusEl.textContent = "貝貝回覆中，暫停聆聽（講完會自動繼續）";
      setHeight();
    }

    function makeRecog() {
      var r = new SR();
      r.lang = lang; r.continuous = true; r.interimResults = true;

      r.onresult = function (e) {
        if (muted) return;
        var interim = "";
        for (var i = e.resultIndex; i < e.results.length; i++) {
          var res = e.results[i];
          if (res.isFinal) {
            var finalText = (res[0].transcript || "").trim();
            if (finalText.length >= minChars) {
              seq += 1;
              Streamlit.setComponentValue({ supported: true, seq: seq, text: finalText });
              enterMuted(SAFETY_MS);   // 送出後立刻自動靜音，等 Python 傳來真正時長再覆蓋
              return;
            }
          } else {
            interim += res[0].transcript;
          }
        }
        if (!muted) statusEl.textContent = interim ? ("聆聽中… " + interim) : "聆聽中…";
      };

      r.onend = function () {
        if (wantOn && !muted) { try { r.start(); } catch (err) {} }
      };

      r.onerror = function (ev) {
        if (ev.error === "not-allowed" || ev.error === "service-not-allowed") {
          wantOn = false; muted = false;
          if (resumeTimer) { clearTimeout(resumeTimer); resumeTimer = null; }
          paintIdle();
          statusEl.textContent = "麥克風權限被拒，請在網址列允許麥克風後再試。";
          setHeight();
        }
      };
      return r;
    }

    function enterMuted(ms) {
      muted = true;
      if (recog) { try { recog.stop(); } catch (e) {} }
      paintSpeaking();
      if (resumeTimer) clearTimeout(resumeTimer);
      resumeTimer = setTimeout(resumeIfWanted, Math.max(0, ms));
    }
    function resumeIfWanted() {
      if (resumeTimer) { clearTimeout(resumeTimer); resumeTimer = null; }
      muted = false;
      if (wantOn) { if (!recog) recog = makeRecog(); try { recog.start(); } catch (e) {} }
      paintIdle();
    }

    function startListen() {
      if (!recog) recog = makeRecog();
      wantOn = true;
      if (!muted) { try { recog.start(); } catch (err) {} }
      paintIdle();
    }
    function stopListen() {
      wantOn = false;
      if (resumeTimer) { clearTimeout(resumeTimer); resumeTimer = null; }
      muted = false;
      if (recog) { try { recog.stop(); } catch (err) {} }
      paintIdle();
    }

    micBtn.addEventListener("click", function () {
      if (wantOn) stopListen(); else startListen();
    });

    // Python 每次 rerun 呼叫這裡。recog 是這個 IIFE 的變數，rerun 不會清掉 → 收音不中斷。
    Streamlit.onRender(function (args) {
      args = args || {};
      if (args.lang && args.lang !== lang) { lang = args.lang; if (recog) recog.lang = lang; }
      if (typeof args.min_chars === "number") minChars = args.min_chars;

      // 外部強制暫停（可選）：paused=true 時一律靜音
      if (args.paused === true && !muted) enterMuted(SAFETY_MS);

      // 偵測「新的一段 AI 朗讀」：speak_token 變了 → 靜音 speak_ms 這麼久，講完自動恢復
      if (typeof args.speak_token !== "undefined" && args.speak_token !== lastSpeakToken) {
        lastSpeakToken = args.speak_token;
        if (wantOn) {
          var ms = (typeof args.speak_ms === "number" ? args.speak_ms : 0);
          enterMuted(ms + BUFFER_MS);   // ms=0（純文字回覆）→ 幾乎立刻恢復
        }
      }
      setHeight();
    });

    setHeight();
  })();
  </script>
</body>
</html>
